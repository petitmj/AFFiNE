# AFFiNE Self-Hosted Docker Compose Configuration
# This file provides a complete setup for self-hosting AFFiNE with Notion Zero-Loss Import support
# 
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose down           # Stop all services
#   docker-compose pull           # Pull latest images
#   docker-compose up -d --build  # Rebuild and restart (for local development)
#
# For production updates:
#   git pull origin feat/notion-zero-loss-import
#   docker-compose down
#   docker-compose up -d --build

version: '3.8'

services:
  # AFFiNE Server - Main application
  affine:
    image: ghcr.io/petitmj/affine:feat-notion-zero-loss-import
    build:
      context: .
      dockerfile: .docker/selfhost/Dockerfile
      args:
        # Use this for production builds
        NODE_ENV: production
    container_name: affine_server
    ports:
      - '3010:3010'  # Main application port
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
    volumes:
      # Persistent storage for blobs (attachments, images, etc.)
      - ./data/storage:/root/.affine/storage
      # Configuration files
      - ./config:/root/.affine/config
    environment:
      - NODE_ENV=production
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://affine@postgres:5432/affine
      - DEPLOYMENT_TYPE=selfhosted
      # Enable Notion Zero-Loss Import feature
      - NOTION_IMPORT_ENABLED=true
      - NOTION_IMPORT_API_VERSION=2025-09-03
      - NOTION_IMPORT_RETENTION_DAYS=30
    restart: unless-stopped
    networks:
      - affine_network

  # Database migration job - Runs once before the server starts
  affine_migration:
    image: ghcr.io/petitmj/affine:feat-notion-zero-loss-import
    build:
      context: .
      dockerfile: .docker/selfhost/Dockerfile
    container_name: affine_migration_job
    volumes:
      - ./data/storage:/root/.affine/storage
      - ./config:/root/.affine/config
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    environment:
      - NODE_ENV=production
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://affine@postgres:5432/affine
      - DEPLOYMENT_TYPE=selfhosted
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - affine_network

  # Redis - Used for caching, sessions, and background jobs
  redis:
    image: redis:7-alpine
    container_name: affine_redis
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    networks:
      - affine_network

  # PostgreSQL with pgvector - Primary database
  postgres:
    image: pgvector/pgvector:pg16-alpine
    container_name: affine_postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: affine
      POSTGRES_DB: affine
      POSTGRES_INITDB_ARGS: '--data-checksums'
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'affine', '-d', 'affine']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - affine_network

  # Optional: Nginx reverse proxy for HTTPS and load balancing
  nginx:
    image: nginx:alpine
    container_name: affine_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - affine
    restart: unless-stopped
    networks:
      - affine_network
    profiles:
      - proxy

networks:
  affine_network:
    driver: bridge

volumes:
  # Named volumes for persistent data
  affine_storage:
  affine_postgres:
  affine_redis:
